<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Bridge Initiative</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e88e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DBI Learn">
    <link rel="apple-touch-icon" href="/icon/icon-192x192.png">
    <link rel="mask-icon" href="/icon/favicon.png" color="#1e88e5">

    <!-- Additional PWA meta for better UX -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="DBI Learn">
    <meta name="apple-mobile-web-app-title" content="DBI Learn">

    <link rel="icon" type="image/png" href="/icon/favicon.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
        }
        
        /* DBI Custom Colors */
        .dbi-blue { color: #1e88e5; }
        .dbi-green { color: #00c853; }
        .dbi-dark-green { color: #009e42; }
        .bg-dbi-blue { background-color: #1e88e5; }
        .bg-dbi-green { background-color: #00c853; }
        .bg-dbi-dark-green { background-color: #009e42; }
        .border-dbi-blue { border-color: #1e88e5; }
        .border-dbi-green { border-color: #00c853; }
        .hover\:bg-dbi-blue:hover { background-color: #1e88e5; }
        .hover\:bg-dbi-green:hover { background-color: #00c853; }
        .hover\:bg-dbi-dark-green:hover { background-color: #009e42; }
        .from-dbi-blue { --tw-gradient-from: #1e88e5; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(30, 136, 229, 0)); }
        .to-dbi-green { --tw-gradient-to: #00c853; }
        .focus\:ring-dbi-blue:focus { --tw-ring-color: #1e88e5; }
        .focus\:border-dbi-blue:focus { border-color: #1e88e5; }
    </style>
</head>
<body class="bg-gradient-to-br from-dbi-blue to-dbi-dark-green min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Logo/Brand with DBI colors -->
        <div class="text-center">
            <div class="inline-block bg-white/10 backdrop-blur-sm rounded-2xl p-4 mb-4">
                <a href="index.html"><img src="logo/B&W DBI-Learn Logo.png" alt="DBI Learn Logo"></a>
            </div>
        </div>
        
        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border-t-4 relative overflow-hidden" style="border-top-color: #00c853;">
            <!-- Decorative corner accent -->
            <div class="absolute top-0 right-0 w-20 h-20 bg-gradient-to-br from-[#1e88e5] to-[#00c853] opacity-10 rounded-bl-full"></div>
            
            <!-- Error Message -->
            <div id="loginError" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4 hidden scroll-mt-24" role="alert"></div>
            
            <!-- Success Message -->
            <div id="loginSuccess" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-4 hidden scroll-mt-24" role="alert"></div>
            
            <!-- Login Form -->
            <form id="loginForm" class="space-y-6">
                <!-- Email/Username Field -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                        Email or Username <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input type="text" id="username" name="username" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1e88e5] focus:border-[#1e88e5] outline-none transition-colors pr-10"
                            placeholder="Enter your email or username"
                            autocomplete="username">
                        <div class="absolute right-3 top-3 text-[#1e88e5]">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                </div>
                
                <!-- Password with toggle visibility -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                        Password <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1e88e5] focus:border-[#1e88e5] outline-none transition-colors pr-12"
                            placeholder="Enter your password"
                            autocomplete="current-password">
                        <button type="button" id="togglePassword" 
                            class="absolute right-3 top-3 text-gray-500 hover:text-[#00c853] focus:outline-none transition-colors duration-200"
                            aria-label="Toggle password visibility">
                            <svg class="h-6 w-6" id="eyeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                            <svg class="h-6 w-6 hidden" id="eyeOffIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" 
                            class="h-4 w-4 text-[#00c853] focus:ring-[#1e88e5] border-gray-300 rounded cursor-pointer">
                        <label for="remember" class="ml-2 block text-sm text-gray-700 cursor-pointer">Remember me</label>
                    </div>
                    <div>
                        <a href="#" id="forgotPassword" 
                            class="text-sm text-[#1e88e5] hover:text-[#009e42] font-medium transition-colors duration-200">
                            Forgot password?
                        </a>
                    </div>
                </div>
                
                <!-- Login Button -->
                <button type="submit" id="loginButton"
                    class="w-full bg-gradient-to-r from-[#1e88e5] to-[#00c853] hover:from-[#1e88e5] hover:to-[#009e42] text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1e88e5] disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:scale-100">
                    <span class="flex items-center justify-center">
                        <span id="buttonText">Login to DBI Learning</span>
                        <svg id="buttonSpinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>
            </form>
            
            <!-- Sign Up Link -->
            <div class="mt-8 text-center border-t border-gray-100 pt-6">
                <p class="text-gray-600">
                    New to Digital Bridge Initiative? 
                    <a href="signup.html" class="text-[#1e88e5] hover:text-[#009e42] font-bold transition-colors duration-200">
                        Create an account
                    </a>
                </p>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-8 text-gray-800 text-sm">
            <p>&copy; 2026 Digital Bridge Initiative.</p>
            <p class="text-xs mt-2 text-gray-700">Shapping Tomorrow's Tech Leaders Today</p>
        </div>
    </div>
    
    <script type="module" src="js/login.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('New Service Worker installing...');
                            
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New content is available, show notification
                                    showUpdateNotification();
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
        
        // Show update notification
        function showUpdateNotification() {
            const updateToast = document.createElement('div');
            updateToast.className = 'fixed bottom-4 right-4 bg-[#1e88e5] text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-bounce';
            updateToast.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas fa-download"></i>
                    <span>New version available! Refresh to update.</span>
                    <button onclick="location.reload()" class="bg-white text-[#1e88e5] px-3 py-1 rounded ml-2">Update</button>
                </div>
            `;
            document.body.appendChild(updateToast);
            
            // Auto remove after 10 seconds
            setTimeout(() => {
                updateToast.remove();
            }, 10000);
        }
        
        // Enable PWA installation prompt
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            
            // Show install button (you can add this to your UI)
            const installButton = document.getElementById('installPwaBtn');
            if (installButton) {
                installButton.style.display = 'block';
                installButton.addEventListener('click', () => {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('User accepted the install prompt');
                        } else {
                            console.log('User dismissed the install prompt');
                        }
                        deferredPrompt = null;
                    });
                });
            }
        });
        
        // Check if app is installed
        window.addEventListener('appinstalled', (evt) => {
            console.log('DBI Learn was installed as a PWA');
            // Send analytics event
            if (typeof gtag !== 'undefined') {
                gtag('event', 'pwa_installed');
            }
        });
    </script>

    <!-- Floating Install Button (shows as a subtle button) -->
    <div id="installPwaContainer" style="display: none;">
        <button id="installPwaBtn" class="fixed bottom-6 right-6 bg-gradient-to-r from-[#1e88e5] to-[#00c853] text-white px-5 py-3 rounded-full shadow-lg hover:shadow-xl transition-all z-40 flex items-center space-x-2 hover:scale-105">
            <i class="fas fa-download"></i>
            <span class="text-sm font-medium">Install App</span>
        </button>
    </div>
</body>
</html>
