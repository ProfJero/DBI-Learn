<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e88e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DBI Learn">
    <link rel="apple-touch-icon" href="/icon/icon-192x192.png">
    <link rel="mask-icon" href="/icon/favicon.png" color="#1e88e5">

    <!-- Additional PWA meta for better UX -->
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Favicon -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
            overflow-x: hidden;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #1e88e5;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #009e42;
        }
        
        /* Sidebar Transition */
        .sidebar {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .sidebar-collapsed {
            width: 80px;
        }
        
        .sidebar-expanded {
            width: 280px;
        }
        
        /* Menu Item Hover Effect */
        .nav-item {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        
        .nav-item:hover {
            background: linear-gradient(135deg, rgba(30, 136, 229, 0.1) 0%, rgba(0, 200, 83, 0.1) 100%);
            transform: translateX(5px);
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, #1e88e5 0%, #00c853 100%);
            color: white;
        }
        
        .nav-item.active i {
            color: white;
        }
        
        /* Main Content Transition */
        .main-content {
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Course Card Animation */
        .course-card {
            transition: all 0.3s ease;
        }
        
        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        /* Category Filter Active State */
        .category-filter.active {
            background: linear-gradient(135deg, #1e88e5 0%, #00c853 100%);
            color: white;
        }
        
        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
        
        /* Tooltip for collapsed sidebar */
        .tooltip {
            position: relative;
        }
        
        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 70px;
            top: 50%;
            transform: translateY(-50%);
            background: #1f2937;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 50;
            pointer-events: none;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                z-index: 1000;
                transform: translateX(-100%);
            }
            
            .sidebar.mobile-open {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0 !important;
            }
        }
        
        /* Progress Ring Animation */
        .progress-ring {
            transform: rotate(-90deg);
        }
        
        .progress-ring-circle {
            transition: stroke-dashoffset 0.5s ease;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        /* Time display styling */
        .time-badge {
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #6b7280;
        }
        
        /* Course action buttons */
        .course-action-btn {
            transition: all 0.2s ease;
        }
        
        .course-action-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<!-- PWA Service Worker Registration -->
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration.scope);
                        
                        // Check for updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('New Service Worker installing...');
                            
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New content is available, show notification
                                    showUpdateNotification();
                                }
                            });
                        });
                    })
                    .catch((error) => {
                        console.error('Service Worker registration failed:', error);
                    });
            });
        }
        
        // Show update notification
        function showUpdateNotification() {
            const updateToast = document.createElement('div');
            updateToast.className = 'fixed bottom-4 right-4 bg-[#1e88e5] text-white px-6 py-3 rounded-lg shadow-lg z-50 animate-bounce';
            updateToast.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas fa-download"></i>
                    <span>New version available! Refresh to update.</span>
                    <button onclick="location.reload()" class="bg-white text-[#1e88e5] px-3 py-1 rounded ml-2">Update</button>
                </div>
            `;
            document.body.appendChild(updateToast);
            
            // Auto remove after 10 seconds
            setTimeout(() => {
                updateToast.remove();
            }, 10000);
        }
        
        // Enable PWA installation prompt
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            // Prevent Chrome 67 and earlier from automatically showing the prompt
            e.preventDefault();
            // Stash the event so it can be triggered later
            deferredPrompt = e;
            
            // Show install button (you can add this to your UI)
            const installButton = document.getElementById('installPwaBtn');
            if (installButton) {
                installButton.style.display = 'block';
                installButton.addEventListener('click', () => {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('User accepted the install prompt');
                        } else {
                            console.log('User dismissed the install prompt');
                        }
                        deferredPrompt = null;
                    });
                });
            }
        });
        
        // Check if app is installed
        window.addEventListener('appinstalled', (evt) => {
            console.log('DBI Learn was installed as a PWA');
            // Send analytics event
            if (typeof gtag !== 'undefined') {
                gtag('event', 'pwa_installed');
            }
        });
    </script>

    <!-- Floating Install Button (shows as a subtle button) -->
    <div id="installPwaContainer" style="display: none;">
        <button id="installPwaBtn" class="fixed bottom-6 right-6 bg-gradient-to-r from-[#1e88e5] to-[#00c853] text-white px-5 py-3 rounded-full shadow-lg hover:shadow-xl transition-all z-40 flex items-center space-x-2 hover:scale-105">
